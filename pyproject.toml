[project]
name = "gfci-gui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown>=3.5",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pyqt6>=6.4.0",
    "qt6-applications>=6.5.0.2.3",
    "scipy>=1.13.1",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.16",
]

# This is an application, not a distributable library: it is launched with
# `python main.py` and packaged with PyInstaller (see gfci_gui.spec). There is
# therefore no build backend and no console-script entry point. uv only manages
# the virtual environment and dependencies.
[tool.uv]
package = false
